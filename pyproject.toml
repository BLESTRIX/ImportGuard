[project]
name = "importguard"
version = "0.1.0"
description = "Recoverable, tenant-isolated supplier CSV imports"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "boto3==1.43.114",
    "celery[redis]==5.6.3",
    "fastapi==0.143.2",
    "jinja2==3.1.6",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.0",
    "pydantic[email]==2.14.1",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.4",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL 17", "concurrency: multi-connection PostgreSQL tests"]

