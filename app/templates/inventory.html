{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><span class="eyebrow">PRODUCT CATALOG</span><h1>Inventory</h1><p class="text-muted">{{ user.currency }} · Quantities reflect current stock.</p></div>{% if user.role == 'ADMIN' %}<a class="btn btn-primary" href="/inventory/new">+ Add product</a>{% endif %}</div>
<form class="filter-bar" action="/inventory" method="get" hx-get="/inventory" hx-target="#inventory-table" hx-push-url="true"><label for="q" class="visually-hidden">Search inventory</label><input id="q" class="form-control" name="q" placeholder="Search by SKU or product name" value="{{ q }}" maxlength="200"><button class="btn btn-outline-secondary">Search</button></form>
<div id="inventory-table">{% include '_inventory_table.html' %}</div>{% endblock %}
