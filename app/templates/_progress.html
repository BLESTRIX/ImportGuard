<div id="progress" {% if item.status in ['QUEUED','VALIDATING','APPLY_QUEUED','APPLYING'] %}hx-get="/imports/{{ item.id }}/progress" hx-trigger="every 2s" hx-swap="outerHTML"{% endif %}>
<section class="panel progress-panel"><div>{% include '_status.html' %}<span class="ms-3">Stage: {{ item.stage|replace('_',' ') }}</span></div><div class="progress-stats"><span><strong>{{ item.processed }}</strong> records processed</span><span><strong>{{ item.valid_count }}</strong> valid</span><span><strong>{{ item.invalid_count }}</strong> invalid</span></div><small class="text-muted">Last progress: {{ item.progress_at }} · Committed checkpoint: {{ item.checkpoint }}</small></section></div>
