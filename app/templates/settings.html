{% extends 'base.html' %}{% block content %}<h1>Organization settings</h1><p class="text-muted">Currency is fixed once inventory or imports exist. It is never converted automatically.</p><form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label class="form-label" for="name">Name</label><input class="form-control mb-3" id="name" name="name" value="{{ user.organization_name }}" maxlength="200" required><label class="form-label" for="currency">Currency (ISO code)</label><input class="form-control mb-3" id="currency" name="currency" value="{{ user.currency }}" pattern="[A-Z]{3}" required><button class="btn btn-primary">Save settings</button></form>{% endblock %}
